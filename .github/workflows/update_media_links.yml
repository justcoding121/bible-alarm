name: Update media links

on:
  schedule:
    - cron:  '0 2 * * 0'
    
jobs:
  build:
    env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Run Link Harvestor
      run: dotnet run --project .tools/Bible.Alarm.AudioLinksHarvestor/Bible.Alarm.AudioLinksHarvestor.csproj --configuration Release
     
    - name: Commit changes
      uses: EndBug/add-and-commit@v7
      with:
          author_name: buildbot171
          author_email: buildbot171@gmail.com
          message: 'Update media links database'
          add: '.tools/_index/index.zip'
