# Beta: TestFlight + artifacts only when publish succeeds. Stable: App Store + artifacts when publish succeeds.
# Runs when the bot pushes a [Release] version-bump commit. Ignores [Version sync] merges to prevent cycles.
name: Deploy iOS to App Store

on:
  push:
    branches: [stable, beta]

permissions:
  contents: write

jobs:
  deploy-ios:
    if: github.event.head_commit.author.name == 'github-actions[bot]' && startsWith(github.event.head_commit.message, '[Release]')
    runs-on: macos-26

    env:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.101'
        
    # Install MAUI workload so restore/build get all required workloads (ios, tizen manifest, etc.) without project-based workload restore.
    - name: Install workloads
      run: dotnet workload install maui --skip-manifest-update
        
    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    # Decode and install Apple certificates and provisioning profiles
    - name: Install Apple Certificate
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Normalise base64 (CR/LF, + as space) then decode certificate
        B64="$(echo "$APPLE_CERTIFICATE_BASE64" | tr -d '\r\n\t' | sed 's/ /+/g')"
        echo "$B64" | base64 --decode -o $CERTIFICATE_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install Provisioning Profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      run: |
        # Create Provisioning Profiles directory
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        
        # Normalise base64 (CR/LF, + as space) then decode and install provisioning profile
        B64="$(echo "$PROVISIONING_PROFILE_BASE64" | tr -d '\r\n\t' | sed 's/ /+/g')"
        echo "$B64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
        
    - name: Restore dependencies
      run: dotnet restore src/Bible.Alarm.sln -p:TargetFramework=net10.0-ios

    # Build iOS release (secrets via env to avoid expanding in run - S7636)
    - name: Build iOS Release
      env:
        APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      run: |
        dotnet publish src/Bible.Alarm/Bible.Alarm.csproj \
          --configuration Release \
          --framework net10.0-ios \
          -p:ArchiveOnBuild=true \
          -p:CodesignKey="$APPLE_CODESIGN_IDENTITY" \
          -p:CodesignProvision="$IOS_PROVISIONING_PROFILE_NAME" \
          --output ./artifacts/ios

    # Pre-check: fail if this version/build already exists (avoid upload that succeeds but fails during Apple processing).
    - name: Check build not already on App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      run: |
        set -e
        VERSION=$(sed -n 's/.*<ApplicationDisplayVersion>\([^<]*\)<\/ApplicationDisplayVersion>.*/\1/p' src/Bible.Alarm/Bible.Alarm.csproj | tr -d ' \r')
        BUILD=$(sed -n 's/.*<ApplicationVersion>\([^<]*\)<\/ApplicationVersion>.*/\1/p' src/Bible.Alarm/Bible.Alarm.csproj | tr -d ' \r')
        mkdir -p ~/private_keys
        B64="$(echo "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '\r\n\t' | sed 's/ /+/g')"
        echo "$B64" | base64 --decode -o ~/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
        pip install --quiet pyjwt cryptography
        python .github/scripts/check-asc-build-exists.py \
          "$APP_STORE_CONNECT_API_KEY_ID" \
          "$APP_STORE_CONNECT_API_ISSUER_ID" \
          "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8" \
          "com.jthomas.info.Bible.Alarm" \
          "$VERSION" \
          "$BUILD"

    # Upload to App Store Connect (TestFlight/App Store). If this fails, no artifacts.
    # Upload only (both stable and beta); you submit for review / manage release from App Store Connect.
    - name: Upload to App Store Connect
      id: store_upload
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      run: |
        set -e
        # Normalise base64 (CR/LF, + as space) then decode API key
        mkdir -p ~/private_keys
        B64="$(echo "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '\r\n\t' | sed 's/ /+/g')"
        echo "$B64" | base64 --decode -o ~/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
        
        # Find the .ipa file
        IPA_PATH=$(find ./artifacts/ios -name "*.ipa" | head -1)
        
        if [ -z "$IPA_PATH" ]; then
          echo "No .ipa file found, looking for .app bundle..."
          # If no IPA, try to create one from the app bundle
          APP_PATH=$(find ./artifacts/ios -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r ./artifacts/ios/Bible.Alarm.ipa Payload
            IPA_PATH="./artifacts/ios/Bible.Alarm.ipa"
            rm -rf Payload
          fi
        fi
        
        # Upload using xcrun altool. Fail the step (and job) on any upload failure, like Android.
        set +e
        altool_output=$(xcrun altool --upload-app \
          --type ios \
          --file "$IPA_PATH" \
          --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1)
        altool_exit=$?
        set -e
        echo "$altool_output"
        if [ $altool_exit -ne 0 ]; then
          echo "::error::Upload to App Store Connect failed (exit $altool_exit)."
          exit 1
        fi
        if echo "$altool_output" | grep -q "ERROR:\|Failed to upload\|ENTITY_ERROR\|status : 409"; then
          echo "::error::Upload to App Store Connect failed (error in output)."
          exit 1
        fi

    # Clean up keychain and provisioning profile
    - name: Cleanup
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
        rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision || true
        rm -rf ~/private_keys || true

    # Verify no secrets are staged before committing (exclude build output obj/bin/artifacts).
    - name: Verify no secrets in working directory
      run: |
        FOUND=$(find . -type d \( -name .git -o -name obj -o -name bin -o -name artifacts \) -prune -o -type f \( -name "*.jks" -o -name "*.keystore" -o -name "*.pfx" -o -name "*.p12" -o -name "*.p8" -o -name "*.mobileprovision" \) -print 2>/dev/null)
        if [ -n "$FOUND" ]; then
          echo "ERROR: Secret files found in working directory!"
          echo "$FOUND"
          exit 1
        fi
        echo "OK: No secret files found in working directory"

    # Artifacts only when store publish succeeded.
    - name: Upload Build Artifacts
      if: steps.store_upload.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: BibleAlarm-${{ github.ref_name }}-ios
        path: |
          artifacts/**/*.ipa
        retention-days: 14

    - name: Get version for tag
      if: steps.store_upload.outcome == 'success'
      id: version
      run: |
        VERSION=$(sed -n 's/.*<ApplicationDisplayVersion>\([^<]*\)<\/ApplicationDisplayVersion>.*/\1/p' src/Bible.Alarm/Bible.Alarm.csproj | tr -d ' \r')
        echo "version=${VERSION:-0.0.0}" >> $GITHUB_OUTPUT

    - name: Create release tag and GitHub Release (beta suffix on beta branch)
      if: steps.store_upload.outcome == 'success' && steps.version.outcome == 'success' && steps.version.outputs.version != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}-ios${{ github.ref == 'refs/heads/beta' && '-beta' || '' }}
        target_commitish: ${{ github.sha }}
        name: Bible Alarm iOS ${{ steps.version.outputs.version }}${{ github.ref == 'refs/heads/beta' && ' (beta)' || '' }}
        body: |
          **Version:** ${{ steps.version.outputs.version }}
          **Branch:** ${{ github.ref_name }}
          IPA from this workflow run.

          ### Install IPA (sideload)
          **Option A – TestFlight (easiest)**  
          If you have a TestFlight invite, install from the TestFlight app; the build will appear there after processing.

          **Option B – Mac with Xcode**  
          1. Download the **.ipa** from the assets below.  
          2. Connect your iPhone and open **Xcode** → **Window** → **Devices and Simulators**.  
          3. Select your device, then drag the IPA onto the **Installed Apps** list (or use the **+** button to add it). The app will install if your Apple ID is allowed for development.

          **Option C – AltStore / other sideload tools**  
          Use [AltStore](https://altstore.io) or another sideload tool that supports IPA installation (often requires a free or paid Apple Developer account for signing).
        generate_release_notes: true
        files: artifacts/ios/*.ipa
        fail_on_unmatched_files: false
