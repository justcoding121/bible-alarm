# Beta: publish to Beta Test flight (MICROSOFT_STORE_BETA_FLIGHT_ID). Stable: publish to production. Artifacts/release only when publish succeeds.
name: Deploy Windows to Microsoft Store

on:
  push:
    branches:
      - stable
      - beta

permissions:
  contents: write

jobs:
  deploy-windows:
    if: github.event.head_commit.author.name == 'github-actions[bot]'
    runs-on: windows-latest

    env:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore workloads
      run: dotnet workload restore --project src/Bible.Alarm/Bible.Alarm.csproj

    # Decode and install the code signing certificate
    - name: Install Certificate
      shell: powershell
      env:
        WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      run: |
        $b64 = $env:WINDOWS_CERTIFICATE_BASE64 -replace '[\r\n\t]','' -replace ' ','+'
        $certBytes = [Convert]::FromBase64String($b64)
        $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        
        $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
        Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
        
        Remove-Item $certPath -Force
        
    - name: Restore dependencies
      run: dotnet restore src/Bible.Alarm.sln

    - name: Get Windows version
      id: get_version
      shell: powershell
      run: |
        $manifestFile = "src/Bible.Alarm/Platforms/Windows/Package.appxmanifest"
        $csprojFile = "src/Bible.Alarm/Bible.Alarm.csproj"
        $version = $null
        $manifestContent = Get-Content $manifestFile -Raw -ErrorAction SilentlyContinue
        if ($manifestContent -match 'Version="(\d+\.\d+\.\d+\.\d+)"') {
          $version = $Matches[1]
        } elseif ($manifestContent -match 'Version="(\d+\.\d+(?:\.\d+)*)"') {
          $v = $Matches[1]
          $parts = $v.Split('.')
          if ($parts.Length -eq 2) { $version = "$v.0.0" }
          elseif ($parts.Length -eq 3) { $version = "$v.0" }
          else { $version = $v }
        }
        if (-not $version) {
          $csprojContent = Get-Content $csprojFile -Raw -ErrorAction SilentlyContinue
          if ($csprojContent -match '<ApplicationDisplayVersion>([\d.]+)</ApplicationDisplayVersion>') {
            $v = $Matches[1].Trim()
            $parts = $v.Split('.')
            if ($parts.Length -ge 2) { $version = "$($parts[0]).$($parts[1]).0.0" }
          }
        }
        if ([string]::IsNullOrWhiteSpace($version)) {
          Write-Error "Could not parse version from Package.appxmanifest or Bible.Alarm.csproj"
          exit 1
        }
        Write-Host "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version for release: $version"

    # Build Windows release (thumbprint via env to avoid expanding secret in run - S7636)
    - name: Build Windows Release
      env:
        WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      shell: powershell
      run: |
        dotnet publish src/Bible.Alarm/Bible.Alarm.csproj `
          --configuration Release `
          --framework net10.0-windows10.0.19041.0 `
          -p:RuntimeIdentifierOverride=win-x64 `
          -p:WindowsPackageType=MSIX `
          -p:UseMonoRuntime=false `
          -p:AppxPackageSigningEnabled=true `
          -p:PackageCertificateThumbprint="$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
          --output ./artifacts/windows

    # Create .msixbundle for Store (Store requires bundle if previously released as bundle)
    - name: Create MSIX bundle
      env:
        WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      shell: powershell
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $baseOut = "src/Bible.Alarm/bin/Release/net10.0-windows10.0.19041.0"
        $appPackagesPath = "$baseOut/win-x64/AppPackages"
        $all = Get-ChildItem -Path $appPackagesPath -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "\\Dependencies\\" }
        $msix = $all | ForEach-Object {
          if ($_.Name -match "_(\d+)\.(\d+)\.(\d+)\.(\d+)_") {
            [PSCustomObject]@{ File = $_; Major = [int]$Matches[1]; Minor = [int]$Matches[2]; Build = [int]$Matches[3]; Rev = [int]$Matches[4] }
          }
        } | Sort-Object -Property Major, Minor, Build, Rev -Descending | Select-Object -First 1 -ExpandProperty File
        if (-not $msix) {
          Write-Error "No .msix found under $appPackagesPath"
          exit 1
        }
        if (-not $version -and $msix.Name -match "_(\d+\.\d+\.\d+\.\d+)_") {
          $version = $Matches[1]
          Write-Host "Using version from .msix name: $version"
        }
        if (-not $version) {
          Write-Error "Version is empty. Ensure Get Windows version step ran and Package.appxmanifest has Version attribute."
          exit 1
        }
        $bundleDir = Join-Path $env:RUNNER_TEMP "BibleAlarmBundle"
        if (Test-Path $bundleDir) { Remove-Item $bundleDir -Recurse -Force }
        New-Item -ItemType Directory -Path $bundleDir | Out-Null
        Copy-Item $msix.FullName -Destination $bundleDir -Force
        Write-Host "Copied $($msix.Name) to bundle dir"

        # Must use x64 MakeAppx (runner is x64); ARM exe fails with "not a valid application for this OS platform"
        # Use -like to match path containing \x64\ (regex \x64 is interpreted as char 0x64)
        $makeAppx = $null
        $kitsBin = "C:\Program Files (x86)\Windows Kits\10\bin"
        if (Test-Path $kitsBin) {
          $candidates = Get-ChildItem -Path $kitsBin -Recurse -Filter "MakeAppx.exe" -ErrorAction SilentlyContinue
          $makeAppx = $candidates | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1
          if (-not $makeAppx) { $makeAppx = $candidates | Where-Object { $_.FullName -like "*\x86\*" } | Select-Object -First 1 }
        }
        if (-not $makeAppx) {
          $nugetPath = "C:\Program Files (x86)\Microsoft Visual Studio\Shared\NuGetPackages\microsoft.windows.sdk.buildtools"
          $candidates = Get-ChildItem -Path $nugetPath -Recurse -Filter "MakeAppx.exe" -ErrorAction SilentlyContinue
          $makeAppx = $candidates | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1
          if (-not $makeAppx) { $makeAppx = $candidates | Where-Object { $_.FullName -like "*\x86\*" } | Select-Object -First 1 }
        }
        if (-not $makeAppx) { Write-Error "MakeAppx.exe not found"; exit 1 }
        Write-Host "Using MakeAppx: $($makeAppx.FullName)"

        $bundleName = "Bible.Alarm_${version}_x86_x64_arm64.msixbundle"
        $artifactsDir = Join-Path (Get-Location) "artifacts"
        $bundlePath = Join-Path $artifactsDir $bundleName
        & $makeAppx.FullName bundle /d $bundleDir /p $bundlePath /o
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Created bundle: $bundlePath"

        $signTool = $null
        if (Test-Path "C:\Program Files (x86)\Windows Kits\10\bin") {
          $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "SignTool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64\\SignTool" } | Select-Object -First 1
        }
        if (-not $signTool) {
          $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Microsoft Visual Studio\Shared\NuGetPackages\microsoft.windows.sdk.buildtools" -Recurse -Filter "SignTool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\x64\\SignTool" } | Select-Object -First 1
        }
        if ($signTool) {
          & $signTool.FullName sign /fd SHA256 /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /tr "http://timestamp.digicert.com" /td SHA256 $bundlePath
          if ($LASTEXITCODE -ne 0) { Write-Warning "Signing bundle failed" }
        }
        Write-Host "Bundle ready: $bundlePath"

    # Upload to Microsoft Store: stable → production; beta → Beta Test flight (requires MICROSOFT_STORE_BETA_FLIGHT_ID secret).
    # Uses Service Principal (client_credentials) with resource=manage.devcenter.microsoft.com and Partner Center Manager role; Admin Consent not required.
    # If you get "Identity cannot be authorized": add Azure AD app as Manager in Partner Center; use Store ID (App identity) in MICROSOFT_STORE_APP_ID, not Client ID; use devcenter token resource, not graph. See Microsoft docs on managing Azure AD apps in Partner Center.
    - name: Upload to Microsoft Store
      id: store_upload
      continue-on-error: true
      shell: powershell
      env:
        AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
        AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
        # Store ID from Partner Center App identity, not Azure AD Client ID
        STORE_APP_ID: ${{ secrets.MICROSOFT_STORE_APP_ID }}
        MICROSOFT_STORE_BETA_FLIGHT_ID: ${{ secrets.MICROSOFT_STORE_BETA_FLIGHT_ID }}
      run: |
        $ErrorActionPreference = 'Stop'
        $branch = "${{ github.ref_name }}"
        $isBeta = ($branch -eq "beta")
        if ($isBeta -and -not $env:MICROSOFT_STORE_BETA_FLIGHT_ID) {
            Write-Error "On beta branch, MICROSOFT_STORE_BETA_FLIGHT_ID secret is required to publish to Beta Test flight."
            exit 1
        }
        # Upload the .msixbundle (Store requires bundle); it is created in artifacts by the Create MSIX bundle step
        $msixPath = Get-ChildItem -Path "./artifacts" -Filter "*.msixbundle" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $msixPath) {
            Write-Error "No .msixbundle found under artifacts. Ensure Create MSIX bundle step succeeded."
            exit 1
        }
        Write-Host "Uploading bundle: $($msixPath.FullName) (target: $(if ($isBeta) { 'Beta Test flight' } else { 'Production' }))"
        
        # 1. Token resource must be Dev Center, not Graph, or Store API returns Unauthorized
        $tokenUrl = "https://login.microsoftonline.com/$env:AZURE_AD_TENANT_ID/oauth2/token"
        $body = @{
            grant_type    = "client_credentials"
            client_id     = $env:AZURE_AD_CLIENT_ID
            client_secret = $env:AZURE_AD_CLIENT_SECRET
            resource      = "https://manage.devcenter.microsoft.com"
        }
        
        $tokenResponse = Invoke-RestMethod -Uri $tokenUrl -Method Post -Body $body
        $accessToken = $tokenResponse.access_token
        
        # 3. POST to create submission requires Authorization and Content-Type
        $headers = @{
            Authorization = "Bearer $accessToken"
            "Content-Type" = "application/json"
        }
        
        # 2. Submission URL must use Store ID (Partner Center App identity), not Client ID
        if ($isBeta) {
            $submissionUrl = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:STORE_APP_ID/flights/$env:MICROSOFT_STORE_BETA_FLIGHT_ID/submissions"
        } else {
            $submissionUrl = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:STORE_APP_ID/submissions"
        }
        
        # Delete any pending submissions first
        try {
            $pendingSubmission = Invoke-RestMethod -Uri $submissionUrl -Method Get -Headers $headers -ErrorAction SilentlyContinue
            if ($pendingSubmission.id) {
                Invoke-RestMethod -Uri "$submissionUrl/$($pendingSubmission.id)" -Method Delete -Headers $headers
                Write-Host "Deleted pending submission: $($pendingSubmission.id)"
            }
        } catch {
            # No pending submission, continue
        }
        
        # Create new submission
        $newSubmission = Invoke-RestMethod -Uri $submissionUrl -Method Post -Headers $headers
        $submissionId = $newSubmission.id
        $fileUploadUrl = $newSubmission.fileUploadUrl
        
        Write-Host "Created submission: $submissionId"
        
        # Upload the package
        $uploadHeaders = @{
            "x-ms-blob-type" = "BlockBlob"
        }
        
        # Read package and upload
        $packageBytes = [System.IO.File]::ReadAllBytes($msixPath.FullName)
        Invoke-RestMethod -Uri $fileUploadUrl -Method Put -Headers $uploadHeaders -Body $packageBytes -ContentType "application/octet-stream"
        
        Write-Host "Package uploaded successfully"
        
        # Commit the submission
        $commitUrl = "$submissionUrl/$submissionId/commit"
        Invoke-RestMethod -Uri $commitUrl -Method Post -Headers $headers
        
        Write-Host "Submission committed successfully"

    # Verify no secrets are staged before committing (exclude build output obj/bin/artifacts).
    - name: Verify no secrets in working directory
      shell: powershell
      run: |
        # Check for common secret file patterns
        $secretFiles = Get-ChildItem -Path . -Recurse -Include *.jks,*.keystore,*.pfx,*.p12,*.p8,*.mobileprovision -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*\.git\*" }
        if ($secretFiles) {
          Write-Error "ERROR: Secret files found in working directory!"
          $secretFiles | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }
        Write-Host "OK: No secret files found in working directory"

    # GitHub Release + tag when build+bundle succeeded (run even if upload fails).
    - name: Find MSIX bundle for release
      if: always() && (steps.store_upload.outcome == 'success' || steps.store_upload.outcome == 'failure')
      id: find_package
      shell: powershell
      run: |
        $msixPath = Get-ChildItem -Path "./artifacts" -Filter "*.msixbundle" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $msixPath) {
          Write-Error "No .msixbundle found under artifacts for release"
          exit 1
        }
        $relativePath = $msixPath.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, "").Replace("\", "/")
        Write-Host "package_path=$relativePath" >> $env:GITHUB_OUTPUT
        Write-Host "Found: $relativePath"

    - name: Create release tag and push
      if: always() && (steps.store_upload.outcome == 'success' || steps.store_upload.outcome == 'failure')
      id: release_tag
      env:
        PACKAGE_PATH: ${{ steps.find_package.outputs.package_path }}
      shell: powershell
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        if ([string]::IsNullOrWhiteSpace($version)) {
          $pkg = "$env:PACKAGE_PATH"
          if ($pkg -match 'Bible\.Alarm_(\d+\.\d+\.\d+\.\d+)_') {
            $version = $Matches[1]
            Write-Host "Version from bundle filename: $version"
          }
        }
        if ([string]::IsNullOrWhiteSpace($version)) {
          $manifestFile = "src/Bible.Alarm/Platforms/Windows/Package.appxmanifest"
          $csprojFile = "src/Bible.Alarm/Bible.Alarm.csproj"
          $manifestContent = Get-Content $manifestFile -Raw -ErrorAction SilentlyContinue
          if ($manifestContent -match 'Version="(\d+\.\d+\.\d+\.\d+)"') { $version = $Matches[1] }
          elseif ($manifestContent -match 'Version="(\d+\.\d+(?:\.\d+)*)"') {
            $v = $Matches[1]; $parts = $v.Split('.')
            if ($parts.Length -eq 2) { $version = "$v.0.0" } elseif ($parts.Length -eq 3) { $version = "$v.0" } else { $version = $v }
          }
          if (-not $version) {
            $csprojContent = Get-Content $csprojFile -Raw -ErrorAction SilentlyContinue
            if ($csprojContent -match '<ApplicationDisplayVersion>([\d.]+)</ApplicationDisplayVersion>') {
              $v = $Matches[1].Trim(); $parts = $v.Split('.')
              if ($parts.Length -ge 2) { $version = "$($parts[0]).$($parts[1]).0.0" }
            }
          }
          if ($version) { Write-Host "Version from manifest/csproj fallback: $version" }
        }
        if ([string]::IsNullOrWhiteSpace($version)) {
          Write-Error "Version is empty; could not get from get_version output, bundle filename, or manifest/csproj."
          exit 1
        }
        $branch = "${{ github.ref_name }}"
        $runNumber = "${{ github.run_number }}"
        if ($branch -eq "beta") {
          $tag = "v$version-windows-beta"
        } else {
          git fetch origin stable
          $tag = "v$version-windows-$runNumber"
        }
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a $tag HEAD -m "Windows $branch release $version"
        git push origin $tag
        Write-Host "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release and upload package
      if: always() && (steps.store_upload.outcome == 'success' || steps.store_upload.outcome == 'failure') && steps.release_tag.outcome == 'success' && steps.release_tag.outputs.tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_tag.outputs.tag }}
        name: Bible Alarm Windows ${{ steps.get_version.outputs.version }}${{ github.ref == 'refs/heads/beta' && ' (beta)' || '' }}
        body: |
          **Version:** ${{ steps.get_version.outputs.version }}
          **Branch:** ${{ github.ref_name }}
          Installable .msixbundle for Microsoft Store or sideloading.
        generate_release_notes: true
        files: ${{ steps.find_package.outputs.package_path }}
        fail_on_unmatched_files: true

    # Artifacts when build+bundle succeeded (run even if upload fails).
    - name: Upload Build Artifacts
      if: always() && (steps.store_upload.outcome == 'success' || steps.store_upload.outcome == 'failure')
      uses: actions/upload-artifact@v4
      with:
        name: BibleAlarm-${{ github.ref_name }}-windows
        path: |
          artifacts/**/*.msixbundle
        retention-days: 14
