# Triggered when *any* deploy workflow completes (so it starts up to 3 times per push). Uses concurrency
# so only one run per commit proceeds; the run that executes after all three deploys have completed
# will pass the check and merge.
#
# Intended flow (must match Prepare release version + deploy):
#   After STABLE deploy: merge stable → beta, then merge beta → develop (so production release flows down)
#   After BETA deploy:  merge beta → develop only (no merge to stable)
#
# Pushes only when the merge produced a new commit. If push fails, use PAT: set secret REPO_TOKEN.
name: Sync versions after deploy

on:
  workflow_run:
    workflows:
      - Deploy Windows to Microsoft Store
      - Deploy Android to Google Play
      - Deploy iOS to App Store
    types:
      - completed
    branches:
      - beta
      - stable

concurrency:
  group: sync-after-deploy-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check if all three deploy workflows completed for this push
        id: check
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          resp=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${BRANCH}&head_sha=${HEAD_SHA}&per_page=100")
          w1="Deploy Windows to Microsoft Store"
          w2="Deploy Android to Google Play"
          w3="Deploy iOS to App Store"
          has_w1=$(echo "$resp" | jq -r --arg n "$w1" '[.workflow_runs[] | select(.name == $n and .status == "completed")] | length')
          has_w2=$(echo "$resp" | jq -r --arg n "$w2" '[.workflow_runs[] | select(.name == $n and .status == "completed")] | length')
          has_w3=$(echo "$resp" | jq -r --arg n "$w3" '[.workflow_runs[] | select(.name == $n and .status == "completed")] | length')
          if [ "$has_w1" -ge 1 ] && [ "$has_w2" -ge 1 ] && [ "$has_w3" -ge 1 ]; then
            echo "all_ready=true" >> $GITHUB_OUTPUT
            echo "All three deploy workflows completed for ${HEAD_SHA}; will merge."
          else
            echo "all_ready=false" >> $GITHUB_OUTPUT
            echo "Not all three completed (Windows=$has_w1 Android=$has_w2 iOS=$has_w3); skipping merge."
          fi

      - name: Checkout repo
        if: steps.check.outputs.all_ready == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge to sync version
        if: steps.check.outputs.all_ready == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          if [ "$BRANCH" = "beta" ]; then
            git checkout develop
            before=$(git rev-parse HEAD)
            git merge origin/beta -m "[Version sync] Merge beta into develop"
            if [ "$(git rev-parse HEAD)" != "$before" ]; then
              git push origin develop
            else
              echo "beta already up to date in develop; nothing to push."
            fi
          elif [ "$BRANCH" = "stable" ]; then
            git checkout beta
            before_beta=$(git rev-parse HEAD)
            git merge origin/stable -m "[Version sync] Merge stable into beta"
            if [ "$(git rev-parse HEAD)" != "$before_beta" ]; then
              git push origin beta
              git fetch origin
            else
              echo "stable already up to date in beta; skipping beta push."
            fi
            git checkout develop
            before_dev=$(git rev-parse HEAD)
            git merge origin/beta -m "[Version sync] Merge beta into develop"
            if [ "$(git rev-parse HEAD)" != "$before_dev" ]; then
              git push origin develop
            else
              echo "beta already up to date in develop; nothing to push."
            fi
          fi
