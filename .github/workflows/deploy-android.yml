# Beta: Play beta + artifacts only when publish succeeds. Stable: Play production + artifacts when publish succeeds.
# Runs when the bot pushes a [Release] version-bump commit. Ignores [Version sync] merges to prevent cycles.
name: Deploy Android to Google Play

on:
  push:
    branches: [stable, beta]

permissions:
  contents: write

jobs:
  deploy-android:
    if: github.event.head_commit.author.name == 'github-actions[bot]' && startsWith(github.event.head_commit.message, '[Release]')
    runs-on: ubuntu-latest

    env:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    # Install MAUI Android workload (required by NETSDK1147 for net10.0-android).
    - name: Install workloads
      run: dotnet workload install maui-android --skip-manifest-update
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Decode and setup the keystore for signing (secret passed via env to avoid expanding in run - S7636).
    # Normalise base64: form inputs often turn + into space, so restore + then strip CR/LF/tab only.
    - name: Decode Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        KEYSTORE_PATH="${{ runner.temp }}/android-keystore.jks"
        B64="$(echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t' | sed 's/ /+/g')"
        echo "$B64" | base64 --decode > "$KEYSTORE_PATH"
        echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
      
    - name: Restore dependencies
      run: dotnet restore src/Bible.Alarm/Bible.Alarm.csproj -p:TargetFramework=net10.0-android -p:BUILD_ANDROID_ONLY=true

    # Build Android AAB for Play Store (production on stable, beta track on beta).
    # BUILD_ANDROID_ONLY=true restricts main app and MediaElement to Android only (see csproj); Shared stays net10.0.
    - name: Build Android AAB
      env:
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        dotnet publish src/Bible.Alarm/Bible.Alarm.csproj \
          --configuration Release \
          --framework net10.0-android \
          -p:BUILD_ANDROID_ONLY=true \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=${{ runner.temp }}/android-keystore.jks \
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
          -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
          -p:AndroidPackageFormat=aab \
          --output ./artifacts/android

    # Build Android APK for artifact (easy install for testers)
    - name: Build Android APK
      env:
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        dotnet publish src/Bible.Alarm/Bible.Alarm.csproj \
          --configuration Release \
          --framework net10.0-android \
          -p:BUILD_ANDROID_ONLY=true \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=${{ runner.temp }}/android-keystore.jks \
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
          -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
          -p:AndroidPackageFormat=apk \
          --output ./artifacts/android-apk

    # Upload to Google Play (production on stable, beta track on beta). If this fails, no artifacts.
    # Commit edit only; you send for review from Play Console (both stable and beta).
    - name: Upload to Google Play
      id: store_upload
      uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.jthomas.info.Bible.Alarm
        releaseFiles: ./artifacts/android/*-Signed.aab
        track: ${{ github.ref == 'refs/heads/stable' && 'production' || 'beta' }}
        status: completed

    # Clean up keystore
    - name: Clean up keystore
      if: always()
      run: rm -f "${{ runner.temp }}/android-keystore.jks"

    # Verify no secrets are staged before committing (exclude build output obj/bin/artifacts).
    - name: Verify no secrets in working directory
      run: |
        # Check for common secret file patterns
        if find . -name "*.jks" -o -name "*.keystore" -o -name "*.pfx" -o -name "*.p12" -o -name "*.p8" -o -name "*.mobileprovision" | grep -v ".git"; then
          echo "ERROR: Secret files found in working directory!"
          find . -name "*.jks" -o -name "*.keystore" -o -name "*.pfx" -o -name "*.p12" -o -name "*.p8" -o -name "*.mobileprovision" | grep -v ".git"
          exit 1
        fi
        echo "OK: No secret files found in working directory"

    # Artifacts only when store publish succeeded.
    - name: Upload Build Artifacts
      if: steps.store_upload.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: BibleAlarm-${{ github.ref_name }}-android
        path: |
          artifacts/**/*.aab
          artifacts/**/*.apk
        retention-days: 14

    - name: Get version for tag
      if: steps.store_upload.outcome == 'success'
      id: version
      run: |
        VERSION=$(sed -n 's/.*<ApplicationDisplayVersion>\([^<]*\)<\/ApplicationDisplayVersion>.*/\1/p' src/Bible.Alarm/Bible.Alarm.csproj | tr -d ' \r')
        echo "version=${VERSION:-0.0.0}" >> $GITHUB_OUTPUT

    - name: Create release tag and GitHub Release (beta suffix on beta branch)
      if: steps.store_upload.outcome == 'success' && steps.version.outcome == 'success' && steps.version.outputs.version != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}-android${{ github.ref == 'refs/heads/beta' && '-beta' || '' }}
        target_commitish: ${{ github.sha }}
        name: Bible Alarm Android ${{ steps.version.outputs.version }}${{ github.ref == 'refs/heads/beta' && ' (beta)' || '' }}
        body: |
          **Version:** ${{ steps.version.outputs.version }}
          **Branch:** ${{ github.ref_name }}
          AAB and APK artifacts from this workflow run.

          ### Install APK (sideload)
          1. Download the **.apk** from the assets below.
          2. On your Android device, allow installation from your browser or file manager: **Settings** → **Apps** → **Chrome** (or the app you use to download) → **Install unknown apps** → allow.
          3. Open the downloaded APK and tap **Install**.
        generate_release_notes: true
        files: |
          artifacts/android/*.aab
          artifacts/android-apk/*.apk
        fail_on_unmatched_files: false
