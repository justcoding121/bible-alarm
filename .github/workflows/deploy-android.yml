# Beta: Play beta + artifacts only when publish succeeds. Stable: Play production + artifacts when publish succeeds.
name: Deploy Android to Google Play

on:
  push:
    branches:
      - stable
      - beta

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    
    env:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore workloads
      run: dotnet workload restore --project src/Bible.Alarm/Bible.Alarm.csproj
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Decode and setup the keystore for signing (secret passed via env to avoid expanding in run - S7636)
    - name: Decode Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        KEYSTORE_PATH="${{ runner.temp }}/android-keystore.jks"
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
      
    - name: Restore dependencies
      run: dotnet restore src/Bible.Alarm.sln
      
    # Patch version for Android only (csproj ApplicationVersion / ApplicationDisplayVersion)
    - name: Patch Android Version
      run: dotnet run --project .tools/Bible.Alarm.VersionPatcher/Bible.Alarm.VersionPatcher.csproj --configuration Release -- --platform=Android

    # Build Android AAB for Play Store (production on stable, beta track on beta)
    - name: Build Android AAB
      env:
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        dotnet publish src/Bible.Alarm/Bible.Alarm.csproj \
          --configuration Release \
          --framework net10.0-android \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=${{ runner.temp }}/android-keystore.jks \
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
          -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
          -p:AndroidPackageFormat=aab \
          --output ./artifacts/android

    # Build Android APK for artifact (easy install for testers)
    - name: Build Android APK
      env:
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        dotnet publish src/Bible.Alarm/Bible.Alarm.csproj \
          --configuration Release \
          --framework net10.0-android \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=${{ runner.temp }}/android-keystore.jks \
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
          -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
          -p:AndroidPackageFormat=apk \
          --output ./artifacts/android-apk

    # Upload to Google Play (production on stable, beta track on beta). If this fails, no artifacts.
    - name: Upload to Google Play
      id: store_upload
      uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.jthomas.info.Bible.Alarm
        releaseFiles: ./artifacts/android/*.aab
        track: ${{ github.ref == 'refs/heads/stable' && 'production' || 'beta' }}
        status: completed
        
    # Clean up keystore
    - name: Clean up keystore
      if: always()
      run: rm -f "${{ runner.temp }}/android-keystore.jks"

    # Verify no secrets are staged before committing
    - name: Verify no secrets in working directory
      run: |
        # Check for common secret file patterns
        if find . -name "*.jks" -o -name "*.keystore" -o -name "*.pfx" -o -name "*.p12" -o -name "*.p8" -o -name "*.mobileprovision" | grep -v ".git"; then
          echo "ERROR: Secret files found in working directory!"
          find . -name "*.jks" -o -name "*.keystore" -o -name "*.pfx" -o -name "*.p12" -o -name "*.p8" -o -name "*.mobileprovision" | grep -v ".git"
          exit 1
        fi
        echo "OK: No secret files found in working directory"

    # Commit version changes (only specific version files)
    - name: Commit version changes
      uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5
      with:
        author_name: github-actions[bot]
        author_email: github-actions[bot]@users.noreply.github.com
        message: '[Android] Update app version for Play Store release'
        add: |
          src/Bible.Alarm/Bible.Alarm.csproj
          src/Bible.Alarm/Platforms/Android/AndroidManifest.xml
        default_author: github_actions
        skip_dirty_check: false
        push: true

    # Artifacts only when store publish succeeded.
    - name: Upload Build Artifacts
      if: steps.store_upload.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: BibleAlarm-${{ github.ref_name }}-android
        path: |
          artifacts/**/*.aab
          artifacts/**/*.apk
        retention-days: 14
