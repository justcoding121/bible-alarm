# Runs on every push to beta/stable. If the push was by a human (not the bot), bumps version
# once (csproj + iOS + Windows manifests) and pushes. That push triggers the three deploy
# workflows; they only run when the push is from the bot (see their job condition), so they
# build the already-bumped commit. This keeps a single version bump per release.
name: Prepare release version

on:
  push:
    branches:
      - beta
      - stable

jobs:
  bump-version:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore VersionPatcher
        run: dotnet restore .tools/Bible.Alarm.VersionPatcher/Bible.Alarm.VersionPatcher.csproj

      - name: Bump version once (csproj + iOS + Windows manifests)
        run: dotnet run --project .tools/Bible.Alarm.VersionPatcher/Bible.Alarm.VersionPatcher.csproj --configuration Release -- --platform=Release

      - name: Commit and push version bump
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: '[Release] Bump version for ${{ github.ref_name }}'
          add: |
            src/Bible.Alarm/Bible.Alarm.csproj
            src/Bible.Alarm/Platforms/iOS/Info.plist
            src/Bible.Alarm/Platforms/Windows/Package.appxmanifest
          default_author: github_actions
          push: true
