# Runs on every push to beta/stable (e.g. merge develop→beta or beta→stable). If the head commit
# is not already a version bump for this branch and not a version-sync merge, bumps version once
# and pushes. Deploy workflows trigger on that push and build the bumped version.
#
# Intended flow:
#   Push to stable → bump version → push [Release] commit → deploys run (production) → sync: stable→beta, then beta→develop
#   Push to beta   → bump version → push [Release] commit → deploys run (beta track) → sync: beta→develop only
#
# We skip the bump when:
#   1. The head commit IS already "[Release] Bump version for <this branch>" (avoids double-bump
#      after our own bot push).
#   2. The head commit starts with "[Version sync]" (sync pushes from stable→beta or beta→develop).
#   3. The head commit is a bot "[Release]" for ANY branch (handles fast-forward syncs where the
#      head is e.g. "[Release] Bump version for stable" landing on beta). The --no-ff flag in the
#      sync workflow is the primary guard; this is a safety net.
#
# Requires secret REPO_TOKEN (PAT) for the version-bump push.
name: Prepare release version

on:
  push:
    branches:
      - beta
      - stable

jobs:
  bump-version:
    if: >-
      !(github.event.head_commit.author.name == 'github-actions[bot]'
        && startsWith(github.event.head_commit.message, '[Release] Bump version for '))
      && !startsWith(github.event.head_commit.message, '[Version sync]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore VersionPatcher
        run: dotnet restore .tools/Bible.Alarm.VersionPatcher/Bible.Alarm.VersionPatcher.csproj

      - name: Bump version once (csproj + iOS + Windows manifests)
        run: dotnet run --project .tools/Bible.Alarm.VersionPatcher/Bible.Alarm.VersionPatcher.csproj --configuration Release -- --platform=Release

      - name: Commit and push version bump
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: '[Release] Bump version for ${{ github.ref_name }}'
          add: |
            src/Bible.Alarm/Bible.Alarm.csproj
            src/Bible.Alarm/Platforms/iOS/Info.plist
            src/Bible.Alarm/Platforms/Windows/Package.appxmanifest
          default_author: github_actions
          push: true
