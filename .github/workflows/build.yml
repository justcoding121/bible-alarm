name: Build

# Fan-out / fan-in:
#   test-windows  ─┐
#   test-android  ─┼──► sonar (one analysis with merged coverage)
#   test-ios      ─┘
#
# The three test jobs run in parallel and each uploads a coverage-* artifact. The sonar job downloads
# all three, runs SonarScanner once with comma-separated sonar.cs.opencover.reportsPaths, and pushes a
# single analysis to SonarCloud. See tests/README.md and the multi-platform_coverage plan for context.
#
# Android is driven by adb against an Activity (TestRunnerActivity) rather than xharness's `am
# instrument` because Mono is not initialized when Android instantiates a custom Instrumentation
# under .NET MAUI; iOS still goes through xharness apple test (the XCUITest entry-point path runs
# *after* the managed runtime is up and is unaffected).

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  XHARNESS_VERSION: 10.0.0-prerelease.26230.1
  XHARNESS_FEED: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json

jobs:
  # ----- Windows + Shared host-based test pass --------------------------------------------------
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply CI SDK pin (.github/dotnet/global.ci.json → global.json)
        run: Copy-Item -Path .github/dotnet/global.ci.json -Destination global.json -Force
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Explicit install matches test-android / test-ios and avoids dotnet workload restore NuGet
      # resolution regressions on windows-latest (restore can exit 1 while setup-dotnet succeeds).
      - name: Install MAUI workloads (Windows)
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore Bible.Alarm.sln

      # Sonar's analyzer-based scan still runs in the sonar job; here we only need a self-signed cert
      # so the WinUI MSIX targets can stage during `dotnet build`.
      - name: Create Windows package signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Bible.Alarm" -KeyAlgorithm RSA -KeyLength 2048 -KeyUsage DigitalSignature -Type CodeSigningCert -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10)
          $pwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert $cert -FilePath "src/Bible.Alarm/Bible.Alarm_TemporaryKey.pfx" -Password $pwd
        shell: pwsh

      - name: Build solution
        run: dotnet build Bible.Alarm.sln --configuration Release -m:1 --verbosity minimal

      # Filter Out the Android/iOS-tagged smoke tests; they run in their own job and would fail here
      # (their assemblies are not built for net10.0-windows). Coverage from this pass writes to a
      # deterministic path that we copy into TestResults/coverage-windows.xml below.
      - name: Run Windows + Shared tests
        run: |
          dotnet test Bible.Alarm.sln `
            --configuration Release `
            --no-build `
            --verbosity normal `
            --logger "trx;LogFileName=test-results.trx" `
            --collect:"XPlat Code Coverage;Format=opencover,cobertura" `
            --filter "Platform!=Android&Platform!=iOS&UI!=Windows&UI!=Android&UI!=iOS"
        shell: pwsh

      - name: Stage coverage artifact
        run: |
          New-Item -ItemType Directory -Path artifacts/coverage-windows -Force | Out-Null
          $cov = Get-ChildItem -Path . -Recurse -Filter coverage.opencover.xml -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cov) {
            Copy-Item -Force $cov.FullName artifacts/coverage-windows/coverage-windows.xml
          } else {
            Write-Error "No OpenCover XML produced by the Windows test pass"
          }
        shell: pwsh

      - name: Upload Windows coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-windows
          path: artifacts/coverage-windows/coverage-windows.xml
          if-no-files-found: error

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-windows
          path: |
            **/test-results.trx
            **/coverage.cobertura.xml
          retention-days: 30
          if-no-files-found: ignore

  # ----- Android device-test pass via Activity-based runner on a Linux runner with KVM ----------
  # We do NOT use `xharness android test --instrumentation=...` here. Custom Android Instrumentation
  # subclasses fail under .NET MAUI (Mono is not initialized when Android calls Instrumentation.onCreate
  # → UnsatisfiedLinkError on the ACW's n_onCreate). Tests are launched as TestRunnerActivity via
  # adb instead, with an on-device sentinel (done.txt) signalling completion. See
  # .cursor/rules/testing/multi-platform-tests.mdc.
  test-android:
    runs-on: ubuntu-latest
    # Required by the reactivecircus emulator runner action below: the action mounts /dev/kvm.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Apply CI SDK pin
        run: cp -f .github/dotnet/global.ci.json global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore (Android-only)
        run: dotnet restore tests/Bible.Alarm.Tests.Android/Bible.Alarm.Tests.Android.csproj -p:BUILD_ANDROID_ONLY=true

      # coverlet.msbuild instruments at build time; the OpenCover XML is written by coverlet's
      # AppDomain.ProcessExit hook (fired by Environment.Exit inside TestRunnerActivity), so the
      # path we set here must be a *device-side* path the activity can write to.
      # `-c Debug -p:PublishTrimmed=true` is the load-bearing combination for Android coverage:
      # Release builds aggressively in-place link MAUI workload references straight out of
      # ~/.nuget/packages/microsoft.maui.controls/<ver>/lib/<tfm>/, never copying them into bin/.
      # coverlet's Cecil resolver only looks beside Bible.Alarm.dll, so it cannot find
      # Microsoft.Maui.Controls and silently skips instrumentation
      # (CecilAssemblyResolutionException → no coverage.android.opencover.xml on the device).
      # Debug builds copy workload assemblies into bin/Debug/<tfm>/ which lets the resolver succeed.
      # PublishTrimmed=true is forced (not the Debug default of false) because the trimmer pass
      # produces the ACW typemap; without it MainApplication.n_onCreate dies with
      # UnsatisfiedLinkError before any test runs. See the Bible.Alarm.Tests.Android.csproj header
      # comment and the "Android coverage" row in [.cursor/rules/testing/multi-platform-tests.mdc].
      # `-m:1` forces single-threaded MSBuild: with parallelism on, Microsoft.Maui.Controls.Build.Tasks's
      # XamlCTask occasionally fails on Linux with `MSB3371: ...XamlC.stamp ... being used by another
      # process` while building MediaElement (see dotnet/maui#12112). Forcing sequential build is
      # the standard workaround; it adds ~10s to a build that already takes 2 min, which we will
      # gladly accept for stability. Local Windows builds do not hit this race.
      - name: Build Android test APK
        run: |
          mkdir -p artifacts/coverage-android
          dotnet build tests/Bible.Alarm.Tests.Android/Bible.Alarm.Tests.Android.csproj \
            -c Debug \
            -f net10.0-android \
            -m:1 \
            -p:BUILD_ANDROID_ONLY=true \
            -p:PublishTrimmed=true \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=/sdcard/Documents/test-results/coverage.android.opencover.xml

      - name: Enable KVM (required by the AVD runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner's script-parser splits on newlines and runs EACH line as a
          # separate `sh -c` — shell variables do not persist (APK was always empty → "No signed APK").
          # Use one line that invokes a checked-in bash script. See .github/scripts/ci-android-device-tests.sh.
          # IMPORTANT: every adb-against-the-emulator step must live in that script. Once this action
          # returns, the emulator process is stopped, adb commands hang or fail, and we lose
          # /sdcard/Documents/test-results/coverage.android.opencover.xml forever.
          script: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-android-device-tests.sh"

      - name: Upload Android coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-android
          path: artifacts/coverage-android/coverage-android.xml
          # We want a hard failure when the device produced no OpenCover XML — that's the signal
          # that coverlet's Cecil instrumentation regressed (e.g. someone swapped Debug back to
          # Release) and Sonar would otherwise silently lose the Android slice.
          if-no-files-found: error

      - name: Upload Android test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-logs
          path: artifacts/coverage-android/**
          retention-days: 14
          if-no-files-found: ignore

  # ----- iOS device-test pass via xharness on a macOS runner ------------------------------------
  test-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Apply CI SDK pin
        run: cp -f .github/dotnet/global.ci.json global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Install xharness CLI
        run: |
          dotnet tool install --global Microsoft.DotNet.XHarness.CLI \
            --version "$XHARNESS_VERSION" \
            --add-source "$XHARNESS_FEED"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        # Use whichever iPhone simulator the runner image ships; macos-latest currently includes 17.x
        # and 18.x runtimes. xharness picks the booted device automatically with --target=ios-simulator-64.
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ \(" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Booting simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Restore (iOS-only)
        run: dotnet restore tests/Bible.Alarm.Tests.iOS/Bible.Alarm.Tests.iOS.csproj -p:BUILD_IOS_ONLY=true

      # `-m:1` mirrors the Android slice — defensive against MAUI's XamlCTask file-lock race on
      # parallel builds. iOS hits this less often than Android (likely because the iOS pipeline
      # doesn't fan out the IL linker the same way), but the cost of single-threaded build is small
      # enough to apply uniformly. RuntimeIdentifier is set on the *test* project; Bible.Alarm.csproj
      # is built transitively without RID (UndefineProperties) and explicitly with EnableCodeSigning=false
      # (AdditionalProperties on the ProjectReference) so the codesign step is skipped on the hosted
      # macOS runner that has no developer keychain identity.
      - name: Build iOS test bundle
        run: |
          mkdir -p artifacts/coverage-ios
          # CoverletOutput is a *relative* path. coverlet.msbuild bakes it into the recorder at
          # build time as a literal string; at runtime the simulator app's File.Open call resolves
          # it against the current working directory. AppDelegate.FinishedLaunching relocates CWD
          # to NSDocumentDirectory at launch (see tests/Bible.Alarm.Tests.iOS/Platforms/iOS/AppDelegate.cs)
          # so coverage-ios.xml lands at
          #   ~/Library/Developer/CoreSimulator/Devices/<UUID>/data/Containers/Data/Application/<UUID>/Documents/coverage-ios.xml
          # which the next "Pull iOS coverage from simulator container" step `find`s and copies
          # back into artifacts/coverage-ios/. An absolute $GITHUB_WORKSPACE path silently no-ops
          # because the iOS simulator's seatbelt sandbox blocks writes outside the app container.
          dotnet build tests/Bible.Alarm.Tests.iOS/Bible.Alarm.Tests.iOS.csproj \
            -c Debug \
            -f net10.0-ios \
            -m:1 \
            -p:BUILD_IOS_ONLY=true \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:MtouchLink=SdkOnly \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=coverage-ios.xml

      - name: Run xharness on simulator
        run: |
          # Repo ships `.config/dotnet-tools.json` with Microsoft.DotNet.XHarness.CLI. `dotnet xharness`
          # resolves as a *local* tool first; without restore the SDK prints "Run dotnet tool restore…"
          # even if a global xharness exists. Restore once from repo root (NuGet.config maps CLI to dotnet-eng).
          dotnet tool restore
          APP_PATH=$(find tests/Bible.Alarm.Tests.iOS/bin/Debug/net10.0-ios -maxdepth 3 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "iOS .app bundle not found"; exit 1; fi
          # Hosted macOS runners often exceed xharness default TCP handshake budget (exit 90 APP_LAUNCH_TIMEOUT).
          # We deliberately do NOT pass --reset-simulator: the next step needs the app's container
          # (under ~/Library/Developer/CoreSimulator/Devices/<UUID>/data/Containers/Data/Application/<UUID>/)
          # to still exist so we can `find` and copy coverage-ios.xml out of it.
          dotnet xharness apple test \
            --app="$APP_PATH" \
            --target=ios-simulator-64 \
            --launch-timeout=00:20:00 \
            --output-directory="$GITHUB_WORKSPACE/artifacts/coverage-ios"

      - name: Pull iOS coverage from simulator container
        run: |
          # AppDelegate.FinishedLaunching relocates CWD to NSDocumentDirectory before xunit runs;
          # coverlet's recorder then writes the (relative) coverage-ios.xml into that directory,
          # which the host sees at the long CoreSimulator container path below. -print -quit picks
          # the first hit; even if multiple booted simulators exist, the only one our build wrote
          # to is the one xharness picked, and any other coverage-ios.xml in the tree would be
          # stale from a previous run on the same image (extremely unlikely on a fresh runner).
          SRC="$(find "$HOME/Library/Developer/CoreSimulator/Devices" \
                      -path '*/Documents/coverage-ios.xml' -print -quit 2>/dev/null || true)"
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::coverage-ios.xml not found inside any iOS simulator container."
            echo "Diagnostic: scanning for any coverage* file in the simulator tree:"
            find "$HOME/Library/Developer/CoreSimulator/Devices" -name 'coverage*' -print 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "Found coverage at $SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/artifacts/coverage-ios/coverage-ios.xml"

      - name: Upload iOS coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-ios
          path: artifacts/coverage-ios/coverage-ios.xml
          if-no-files-found: error

      - name: Upload iOS xharness logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xharness-ios-logs
          path: artifacts/coverage-ios/**
          retention-days: 14
          if-no-files-found: ignore

  # ----- Single Sonar analysis with all three coverage files merged -----------------------------
  sonar:
    runs-on: windows-latest
    needs: [test-windows, test-android, test-ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply CI SDK pin
        run: Copy-Item -Path .github/dotnet/global.ci.json -Destination global.json -Force
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install MAUI workloads (Windows)
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore Bible.Alarm.sln

      - name: Create Windows package signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Bible.Alarm" -KeyAlgorithm RSA -KeyLength 2048 -KeyUsage DigitalSignature -Type CodeSigningCert -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10)
          $pwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert $cert -FilePath "src/Bible.Alarm/Bible.Alarm_TemporaryKey.pfx" -Password $pwd
        shell: pwsh

      # download-artifact creates one folder per artifact name; layout becomes:
      #   TestResults/coverage-windows/coverage-windows.xml
      #   TestResults/coverage-android/coverage-android.xml
      #   TestResults/coverage-ios/coverage-ios.xml
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-*
          path: TestResults

      - name: SonarScanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # sonar.cs.opencover.reportsPaths is comma-separated; the analyzer unions covered lines
        # across all three reports (a line is covered if any platform covered it).
        # New test host projects (Bible.Alarm.Tests.{Android,iOS}) are excluded from analysis but
        # their coverage hits on production source are still imported.
        run: |
          dotnet sonarscanner begin `
            /k:"justcoding121_bible-alarm" `
            /o:"justcoding121" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.language="cs" `
            /d:sonar.dotnet.excludeTestProjects="true" `
            /d:sonar.exclusions="**/bin/**/*,**/obj/**/*,**/*.Tests/**,**/*.Tests.Android/**,**/*.Tests.iOS/**,**/Database/Migrations/**" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/coverage-windows/coverage-windows.xml,TestResults/coverage-android/coverage-android.xml,TestResults/coverage-ios/coverage-ios.xml"
        shell: pwsh

      # Sonar requires a build between begin and end so the analyzer can attach to the compilers.
      # We rebuild only the Windows + net10.0 TFMs here (Android/iOS source is read by Sonar from disk
      # via the .NET analyzer; we don't need the compiled Android/iOS assemblies for analysis).
      - name: Build solution under SonarScanner
        run: dotnet build Bible.Alarm.sln --configuration Release -m:1 --verbosity minimal

      - name: SonarScanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
        shell: pwsh
