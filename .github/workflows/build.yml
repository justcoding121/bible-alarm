name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply CI SDK pin (.github/dotnet/global.ci.json → global.json)
        run: Copy-Item -Path .github/dotnet/global.ci.json -Destination global.json -Force
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore workloads
        run: dotnet workload restore --project src/Bible.Alarm/Bible.Alarm.csproj

      - name: Restore dependencies
        run: dotnet restore src/Bible.Alarm.sln

      - name: Create Windows package signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Bible.Alarm" -KeyAlgorithm RSA -KeyLength 2048 -KeyUsage DigitalSignature -Type CodeSigningCert -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10)
          $pwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert $cert -FilePath "src/Bible.Alarm/Bible.Alarm_TemporaryKey.pfx" -Password $pwd
        shell: pwsh

      - name: SonarScanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin `
            /k:"justcoding121_bible-alarm" `
            /o:"justcoding121" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.language="cs" `
            /d:sonar.exclusions="**/bin/**/*,**/obj/**/*,**/*.Tests/**,**/Database/Migrations/**,**/*.pem" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
        shell: pwsh

      - name: Build solution
        run: dotnet build src/Bible.Alarm.sln --configuration Release -m:1 --verbosity minimal

      - name: Run tests
        run: dotnet test src/Bible.Alarm.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage;Format=opencover,cobertura"

      - name: SonarScanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            **/test-results.trx
            **/coverage.cobertura.xml
          retention-days: 30
          if-no-files-found: ignore