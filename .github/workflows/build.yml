name: Build

# Three independent test jobs run in parallel:
#   test-windows  — Windows + Shared host-based dotnet test pass + SonarCloud analysis (inline)
#   test-android  — Android device-test pass via Activity-based runner on an emulator
#   test-ios      — iOS device-test pass via xharness on a simulator
#
# SonarCloud analysis runs INSIDE test-windows (sonarscanner begin → build → test → end) instead of
# in a separate downstream job, eliminating ~9-12 min of duplicate workload-install + restore + build
# work per CI run. SonarCloud reads only the Windows OpenCover XML (Android/iOS device hosts do not
# emit coverage by design — see Hard rule #6 + the "Android/iOS coverage" rows in
# .cursor/rules/testing/multi-platform-tests.mdc). Cross-platform business logic in
# tests/Bible.Alarm.Tests/** runs on Windows, so the production code paths Android/iOS exercise are
# already represented in the Windows coverage slice.
#
# PR merge gating: branch protection on `develop` requires test-windows + test-android + test-ios all
# pass. There is no longer a `sonar` required check (SonarCloud's quality gate is reported by the
# SonarCloud GitHub app via the inline analysis).
#
# Android is driven by adb against an Activity (TestRunnerActivity) rather than xharness's `am
# instrument` because Mono is not initialized when Android instantiates a custom Instrumentation
# under .NET MAUI; iOS still goes through xharness apple test (the XCUITest entry-point path runs
# *after* the managed runtime is up and is unaffected).

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  XHARNESS_VERSION: 10.0.0-prerelease.26230.1
  XHARNESS_FEED: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json

jobs:
  # ----- Windows + Shared host-based test pass --------------------------------------------------
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply CI SDK pin (.github/dotnet/global.ci.json → global.json)
        run: Copy-Item -Path .github/dotnet/global.ci.json -Destination global.json -Force
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # Explicit install matches test-android / test-ios and avoids dotnet workload restore NuGet
      # resolution regressions on windows-latest (restore can exit 1 while setup-dotnet succeeds).
      - name: Install MAUI workloads (Windows)
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore Bible.Alarm.sln

      # Self-signed cert lets the WinUI MSIX targets stage during `dotnet build`. SonarScanner's
      # Roslyn analyzers attach to the same `dotnet build` invocation below (no second build).
      - name: Create Windows package signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Bible.Alarm" -KeyAlgorithm RSA -KeyLength 2048 -KeyUsage DigitalSignature -Type CodeSigningCert -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10)
          $pwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert $cert -FilePath "src/Bible.Alarm/Bible.Alarm_TemporaryKey.pfx" -Password $pwd
        shell: pwsh

      # sonarscanner begin must run BEFORE the build so its Roslyn analyzers attach to the
      # compilation. `sonar.cs.opencover.reportsPaths` is a WILDCARD so Sonar unions every per-test-
      # project OpenCover XML produced by `coverlet.collector` (the solution has 7+ test projects
      # contributing coverage; reading only one of them used to produce 0.4% — see "test-windows
      # SonarScanner reports 0% coverage" diagnostic row in
      # [.cursor/rules/testing/multi-platform-tests.mdc]). The staged path is written by the
      # `Stage coverage artifacts` step further down (before `SonarScanner end`).
      # Android/iOS device-host slices do NOT contribute coverage — see Hard rule #6.
      # `sonar.coverage.exclusions` drops orchestration scripts (.ps1, .sh, .py, etc.) from coverage
      # accounting; Android/iOS platform code and XAML code-behind are validated on device/Appium
      # but never instrumented on the Windows OpenCover pass (see .cursor/rules/testing/multi-platform-tests.mdc Hard rule #6).
      # Also exclude whole-file #if ANDROID / #if IOS helpers that live outside Platforms/ (they
      # do not compile into the Windows assembly but Sonar still counts the source).
      # Re-enable sonar.qualitygate.wait after SonarCloud gate is assigned with realistic
      # overall threshold (see .docs/SONARCLOUD_QUALITY_GATE.md). Enabling before UI setup fails CI.
      - name: SonarScanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $csproj = Get-Content src/Bible.Alarm/Bible.Alarm.csproj -Raw
          if ($csproj -notmatch '<ApplicationDisplayVersion>([\d.]+)</ApplicationDisplayVersion>') {
            throw 'ApplicationDisplayVersion not found in Bible.Alarm.csproj'
          }
          $sonarVersion = $Matches[1]
          dotnet sonarscanner begin `
            /k:"justcoding121_bible-alarm" `
            /o:"justcoding121" `
            /v:"$sonarVersion" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.language="cs" `
            /d:sonar.dotnet.excludeTestProjects="true" `
            /d:sonar.exclusions="**/bin/**/*,**/obj/**/*,**/*.Tests/**,**/*.Tests.Android/**,**/*.Tests.iOS/**,**/Database/Migrations/**,**/.github/scripts/**,**/.scripts/**,**/*.ps1,**/*.psm1,**/*.sh,**/*.bash,**/*.zsh,**/*.bat,**/*.cmd,**/*.py" `
            /d:sonar.coverage.exclusions="**/.github/**,**/.scripts/**,**/*.ps1,**/*.psm1,**/*.sh,**/*.bash,**/*.zsh,**/*.bat,**/*.cmd,**/*.py,**/*.android.cs,**/*.ios.cs,**/.tools/**/Program.cs,**/Platforms/Android/**/*.cs,**/Platforms/iOS/**/*.cs,**/Views/**/*.cs,**/ScheduleStateServiceAndroidEnableWithPermission.cs,**/ScheduleStateServiceIosEnableWithPermission.cs,**/IsEnabledIosPermissionChecker.cs,**/SchedulePlatformEnablePermissionRequests.cs" `
            /d:sonar.cs.opencover.reportsPaths="artifacts/coverage-windows/*.opencover.xml"
        shell: pwsh

      - name: Build solution
        run: dotnet build Bible.Alarm.sln --configuration Release -m:1 --verbosity minimal

      # Filter out the Android/iOS-tagged smoke tests; they run in their own job and would fail here
      # (their assemblies are not built for net10.0-windows). `--results-directory TestResults` puts
      # every per-project coverage report under `TestResults/<guid>/coverage.opencover.xml` (one
      # GUID per test project), so the `Stage coverage artifacts` step below can collect them all
      # in a single sweep instead of picking the alphabetically-first one.
      - name: Run Windows + Shared tests
        run: |
          dotnet test Bible.Alarm.sln `
            --configuration Release `
            --no-build `
            --verbosity normal `
            --results-directory TestResults `
            --logger "trx;LogFileName=test-results.trx" `
            --collect:"XPlat Code Coverage;Format=opencover,cobertura" `
            --filter "Platform!=Android&Platform!=iOS&UI!=Windows&UI!=Android&UI!=iOS"
        shell: pwsh

      # Copy EVERY per-project OpenCover XML into the staging dir under a unique name. Previously
      # this step did `Get-ChildItem ... | Select-Object -First 1`, which silently dropped 6+ test
      # projects' coverage on the floor and left only the alphabetically-first project's XML
      # (`Bible.Alarm.Cataloger.Tests`, ~0.4% of `Bible.Alarm.dll`) for SonarCloud — masked by
      # Android/iOS slices in the old multi-platform setup, exposed once Option B made Windows the
      # sole source. Sonar unions covered lines across all matched files via the wildcard
      # `sonar.cs.opencover.reportsPaths` declared above.
      - name: Stage coverage artifacts
        run: |
          New-Item -ItemType Directory -Path artifacts/coverage-windows -Force | Out-Null
          $covs = Get-ChildItem -Path TestResults -Recurse -Filter coverage.opencover.xml -ErrorAction SilentlyContinue
          if (-not $covs) {
            Write-Error "No OpenCover XML produced by the Windows test pass"
            exit 1
          }
          if ($covs.Count -lt 8) {
            Write-Error "Expected at least 8 OpenCover XML files (got $($covs.Count)); coverage merge regression"
            exit 1
          }
          Write-Host "Staging $($covs.Count) OpenCover XML file(s):"
          foreach ($cov in $covs) {
            # `--results-directory TestResults` lays out TestResults/<guid>/coverage.opencover.xml
            # so the parent dir's name (the GUID) is unique per test-project run. Use it to avoid
            # filename collisions when 7+ test projects each emit `coverage.opencover.xml`.
            $guid = $cov.Directory.Name
            $dest = Join-Path "artifacts/coverage-windows" "coverage-$guid.opencover.xml"
            Copy-Item -Force $cov.FullName $dest
            Write-Host "  $($cov.FullName)  ->  $dest  ($([math]::Round($cov.Length/1KB,1)) KB)"
          }
        shell: pwsh

      - name: Generate merged HTML coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          New-Item -ItemType Directory -Path artifacts/coverage-report -Force | Out-Null
          reportgenerator `
            "-reports:artifacts/coverage-windows/*.opencover.xml" `
            "-targetdir:artifacts/coverage-report" `
            -reporttypes:Html
        shell: pwsh

      - name: Upload merged HTML coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-html
          path: artifacts/coverage-report/**
          if-no-files-found: error

      # sonarscanner end submits the .sonarqube/ analysis directory + every staged coverage XML to
      # SonarCloud. Must run AFTER the test pass (so coverage exists) and AFTER staging (so Sonar
      # finds the XMLs via the wildcard in `sonar.cs.opencover.reportsPaths` above).
      - name: SonarScanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
        shell: pwsh

      - name: Upload Windows coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-windows
          path: artifacts/coverage-windows/**
          if-no-files-found: error

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-windows
          path: |
            **/test-results.trx
            **/coverage.cobertura.xml
          retention-days: 30
          if-no-files-found: ignore

  # ----- Android device-test pass via Activity-based runner on a Linux runner with KVM ----------
  # We do NOT use `xharness android test --instrumentation=...` here. Custom Android Instrumentation
  # subclasses fail under .NET MAUI (Mono is not initialized when Android calls Instrumentation.onCreate
  # → UnsatisfiedLinkError on the ACW's n_onCreate). Tests are launched as TestRunnerActivity via
  # adb instead, with an on-device sentinel (done.txt) signalling completion. See
  # .cursor/rules/testing/multi-platform-tests.mdc.
  test-android:
    runs-on: ubuntu-latest
    # Required by the reactivecircus emulator runner action below: the action mounts /dev/kvm.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Apply CI SDK pin
        run: cp -f .github/dotnet/global.ci.json global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore (Android-only)
        run: dotnet restore tests/Bible.Alarm.Tests.Android/Bible.Alarm.Tests.Android.csproj -p:BUILD_ANDROID_ONLY=true

      # `-m:1` forces single-threaded MSBuild: with parallelism on, Microsoft.Maui.Controls.Build.Tasks's
      # XamlCTask occasionally fails on Linux with `MSB3371: ...XamlC.stamp ... being used by another
      # process` while building MediaElement (see dotnet/maui#12112). Forcing sequential build is
      # the standard workaround; it adds ~10s to a build that already takes 2 min, which we will
      # gladly accept for stability. Local Windows builds do not hit this race.
      #
      # Coverage is intentionally NOT collected from this slice. coverlet.msbuild's Cecil resolver
      # cannot resolve `Microsoft.Maui.Controls` inside MAUI Android's bin layout (workload
      # assemblies stay in `~/.nuget/packages/microsoft.maui.controls.core/<ver>/lib/<tfm>/`,
      # never beside `Bible.Alarm.dll`), so instrumentation silently skips and no OpenCover XML
      # is produced. Debug-mode + PublishTrimmed=true + AltCover were all evaluated and either
      # failed instrumentation or broke runtime ACW typemap generation. SonarCloud reads only the
      # Windows OpenCover slice; the shared cross-platform tests in `tests/Bible.Alarm.Tests/**`
      # exercise the same production code paths there, so coverage of business logic is preserved.
      # See "Android coverage" row in [.cursor/rules/testing/multi-platform-tests.mdc] for the
      # full decision history.
      - name: Build Android test APK
        run: |
          dotnet build tests/Bible.Alarm.Tests.Android/Bible.Alarm.Tests.Android.csproj \
            -c Release \
            -f net10.0-android \
            -m:1 \
            -p:BUILD_ANDROID_ONLY=true

      - name: Enable KVM (required by the AVD runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on AVD
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Full suite normally finishes in a few minutes; 20 min is headroom for slow runners.
          # A hung test still waits the full budget — see ci-android-device-tests.sh heartbeat logs.
          ANDROID_TEST_TIMEOUT_SEC: 1200
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner's script-parser splits on newlines and runs EACH line as a
          # separate `sh -c` — shell variables do not persist (APK was always empty → "No signed APK").
          # Use one line that invokes a checked-in bash script. See .github/scripts/ci-android-device-tests.sh.
          # IMPORTANT: every adb-against-the-emulator step must live in that script. Once this action
          # returns, the emulator process is stopped, adb commands hang or fail, and we lose
          # any /sdcard/Documents/test-results artefact (TestResults.xml, done.txt, error.txt,
          # logcat.log) forever.
          script: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-android-device-tests.sh"

      - name: Upload Android test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-logs
          path: artifacts/android-test-logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ----- iOS device-test pass via xharness on a macOS runner ------------------------------------
  test-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Apply CI SDK pin
        run: cp -f .github/dotnet/global.ci.json global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Install xharness CLI
        run: |
          dotnet tool install --global Microsoft.DotNet.XHarness.CLI \
            --version "$XHARNESS_VERSION" \
            --add-source "$XHARNESS_FEED"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        # Use whichever iPhone simulator the runner image ships; macos-latest currently includes 17.x
        # and 18.x runtimes. xharness picks the booted device automatically with --target=ios-simulator-64.
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ \(" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Booting simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Restore (iOS-only)
        run: dotnet restore tests/Bible.Alarm.Tests.iOS/Bible.Alarm.Tests.iOS.csproj -p:BUILD_IOS_ONLY=true

      # `-m:1` mirrors the Android slice — defensive against MAUI's XamlCTask file-lock race on
      # parallel builds. iOS hits this less often than Android (likely because the iOS pipeline
      # doesn't fan out the IL linker the same way), but the cost of single-threaded build is small
      # enough to apply uniformly. RuntimeIdentifier is set on the *test* project; Bible.Alarm.csproj
      # is built transitively without RID (UndefineProperties) and explicitly with EnableCodeSigning=false
      # (AdditionalProperties on the ProjectReference) so the codesign step is skipped on the hosted
      # macOS runner that has no developer keychain identity.
      # Coverage is intentionally NOT collected from this slice. coverlet.msbuild bakes the
      # CoverletOutput path into the recorder at build time via Path.GetFullPath against the
      # build-host CWD, producing an absolute Mac path the iOS simulator's seatbelt sandbox blocks
      # the app from writing to. Workarounds (CWD relocate, /tmp absolute path, AltCover with
      # AltCoverDependencyList) were all evaluated and either failed silently or required
      # significant additional refactoring with uncertain payoff. SonarCloud reads only the Windows
      # OpenCover slice; the shared cross-platform tests in `tests/Bible.Alarm.Tests/**` cover the
      # same production code paths there. See the "iOS coverage" row in
      # [.cursor/rules/testing/multi-platform-tests.mdc] for the full decision history.
      - name: Build iOS test bundle
        run: |
          dotnet build tests/Bible.Alarm.Tests.iOS/Bible.Alarm.Tests.iOS.csproj \
            -c Debug \
            -f net10.0-ios \
            -m:1 \
            -p:BUILD_IOS_ONLY=true \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:MtouchLink=SdkOnly

      - name: Run xharness on simulator
        run: |
          # Repo ships `.config/dotnet-tools.json` with Microsoft.DotNet.XHarness.CLI. `dotnet xharness`
          # resolves as a *local* tool first; without restore the SDK prints "Run dotnet tool restore…"
          # even if a global xharness exists. Restore once from repo root (NuGet.config maps CLI to dotnet-eng).
          dotnet tool restore
          mkdir -p artifacts/xharness-ios-logs
          APP_PATH=$(find tests/Bible.Alarm.Tests.iOS/bin/Debug/net10.0-ios -maxdepth 3 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "iOS .app bundle not found"; exit 1; fi
          # Hosted macOS runners often exceed xharness default TCP handshake budget (exit 90 APP_LAUNCH_TIMEOUT).
          # Default overall run timeout is 15 minutes; install + full shared suite can exceed that (exit 80 APP_CRASH).
          dotnet xharness apple test \
            --app="$APP_PATH" \
            --target=ios-simulator-64 \
            --launch-timeout=00:20:00 \
            --timeout=02:00:00 \
            --output-directory="$GITHUB_WORKSPACE/artifacts/xharness-ios-logs"

      - name: Upload iOS xharness logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xharness-ios-logs
          path: artifacts/xharness-ios-logs/**
          retention-days: 14
          if-no-files-found: ignore

