# ProGuard configuration for Bible Alarm
# Handle Java dependency conflicts

# Keep all classes from our app
-keep class bible.alarm.** { *; }

# Exclude conflicting Google Guava classes
-dontwarn com.google.common.util.concurrent.ListenableFuture
-keep class com.google.common.util.concurrent.ListenableFuture { *; }

# Exclude duplicate classes
-dontwarn com.google.common.**
-keep class com.google.common.** { *; }

# Keep AndroidX Work classes
-keep class androidx.work.** { *; }

# Keep ExoPlayer classes
-keep class com.google.android.exoplayer2.** { *; }

# Keep MediaManager classes
-keep class com.google.android.exoplayer2.** { *; }
