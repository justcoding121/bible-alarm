# ProGuard configuration for Bible Alarm
# Handle Java dependency conflicts

# Keep all classes from our app
-keep class bible.alarm.** { *; }

# Keep Android Auto service classes
-keep class bible.alarm.platforms.android.services.androidauto.** { *; }
-keep class crc64*.AndroidAutoMediaService { *; }
-keep class crc64*.AndroidAutoSession { *; }
-keep class crc64*.AndroidAutoSchedulesScreen { *; }

# Keep AndroidX Car App classes
-keep class androidx.car.app.** { *; }
# Keep CarAppApiLevels class that reads car-app-api.level file
-keep class androidx.car.app.versioning.CarAppApiLevels { *; }
# Keep all resources (including assets)
-keepresourcefiles **/*.level
-keepresourcefiles **/car-app-api.level

# Exclude conflicting Google Guava classes
-dontwarn com.google.common.util.concurrent.ListenableFuture
-keep class com.google.common.util.concurrent.ListenableFuture { *; }

# Exclude duplicate classes
-dontwarn com.google.common.**
-keep class com.google.common.** { *; }

# Keep AndroidX Work classes
-keep class androidx.work.** { *; }

# Keep MediaElement classes (if needed)
# -keep class androidx.media3.** { *; }
