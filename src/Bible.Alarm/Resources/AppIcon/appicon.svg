  <circle cx="256" cy="256" r="240" fill="#512BD4"/>
  
  <!-- Bible icon (larger for app icon) -->
  <rect x="160" y="120" width="192" height="240" rx="16" fill="#ffffff"/>
  <rect x="170" y="130" width="172" height="220" rx="8" fill="#512BD4"/>
  
  <!-- Book lines -->
  <line x1="190" y1="180" x2="322" y2="180" stroke="#ffffff" stroke-width="8"/>
  <line x1="190" y1="220" x2="322" y2="220" stroke="#ffffff" stroke-width="8"/>
  <line x1="190" y1="260" x2="322" y2="260" stroke="#ffffff" stroke-width="8"/>
  <line x1="190" y1="300" x2="322" y2="300" stroke="#ffffff" stroke-width="8"/>
  
  <!-- Alarm clock icon -->
  <circle cx="256" cy="400" r="48" fill="#ffffff" stroke="#512BD4" stroke-width="8"/>
  <line x1="256" y1="400" x2="256" y2="368" stroke="#512BD4" stroke-width="8"/>
  <line x1="256" y1="400" x2="280" y2="376" stroke="#512BD4" stroke-width="8"/>
  
