<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#512BD4" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Bible icon (simplified book shape) -->
  <rect x="40" y="30" width="48" height="60" rx="4" fill="#ffffff"/>
  <rect x="42" y="32" width="44" height="56" rx="2" fill="#512BD4"/>
  
  <!-- Book lines -->
  <line x1="48" y1="45" x2="80" y2="45" stroke="#ffffff" stroke-width="2"/>
  <line x1="48" y1="55" x2="80" y2="55" stroke="#ffffff" stroke-width="2"/>
  <line x1="48" y1="65" x2="80" y2="65" stroke="#ffffff" stroke-width="2"/>
  <line x1="48" y1="75" x2="80" y2="75" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Alarm clock icon -->
  <circle cx="64" cy="100" r="12" fill="#ffffff" stroke="#512BD4" stroke-width="2"/>
  <line x1="64" y1="100" x2="64" y2="92" stroke="#512BD4" stroke-width="2"/>
  <line x1="64" y1="100" x2="70" y2="94" stroke="#512BD4" stroke-width="2"/>
  
  <!-- Clock hands -->
  <circle cx="64" cy="100" r="2" fill="#512BD4"/>
</svg>
